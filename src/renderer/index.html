<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Side Dock</title>
    <!--
      Design language adapted from Javis603/token-monitor (MIT): an edge dock of
      quota bars — percent, remaining fuel and reset countdown — that expands
      into a detail card and a settings panel where providers are picked.
      Provider marks are Simple Icons SVG paths (CC0 1.0); the OpenCode and
      DeepSeek names/logos remain trademarks of their owners.
    -->
    <style>
      :root {
        --fg: #edf0f4;
        --fg2: #9aa3ad;
        --line: rgba(255, 255, 255, 0.1);
        --line2: rgba(255, 255, 255, 0.06);
        --app: rgba(28, 30, 34, 0.62);
        --card: rgba(255, 255, 255, 0.055);
        --card2: rgba(255, 255, 255, 0.085);
        --accent: #4fb4a8;
        --ok: #32d583;
        --warn: #f5a524;
        --err: #ff6166;
        --track: rgba(255, 255, 255, 0.1);
        --deepseek: #4d6bfe;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --fg: #1b1f24;
          --fg2: #667085;
          --line: rgba(0, 0, 0, 0.1);
          --line2: rgba(0, 0, 0, 0.06);
          --app: rgba(249, 250, 252, 0.7);
          --card: rgba(0, 0, 0, 0.04);
          --card2: rgba(0, 0, 0, 0.065);
          --accent: #0f8a80;
          --ok: #0f9d58;
          --warn: #a15c00;
          --err: #c62828;
          --track: rgba(0, 0, 0, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
        font-size: 12px;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      .shell {
        padding: 0;
        height: 100%;
        width: 100%;
      }
      .app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--app);
        border: none;
        border-radius: 0;
        overflow: hidden;
        backdrop-filter: blur(30px) saturate(1.6);
        cursor: grab;
        -webkit-app-region: drag;
        app-region: drag;
      }
      /* Outer (non-docked) edge stays rounded; the docked edge is flush. */
      body[data-snap='left'] .app {
        border-radius: 0 16px 16px 0;
      }
      body[data-snap='right'] .app {
        border-radius: 16px 0 0 16px;
      }
      body[data-snap='top'] .app {
        border-radius: 0 0 16px 16px;
      }
      body[data-snap='bottom'] .app {
        border-radius: 16px 16px 0 0;
      }
      body[data-snap='free'] .app {
        border-radius: 16px;
      }
      .content {
        flex: 0 0 auto;
        width: max-content;
        display: flex;
        flex-direction: column;
        padding: 7px 10px 9px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      button {
        font: inherit;
        color: var(--fg2);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        font-size: 11px;
        line-height: 1;
        -webkit-app-region: no-drag;
        app-region: no-drag;
        transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      button:hover {
        background: var(--card2);
        color: var(--fg);
        border-color: var(--line);
      }
      button.on {
        background: var(--card2);
        color: var(--fg);
        border-color: var(--line);
      }
      .k {
        font-size: 9px;
        letter-spacing: 0.7px;
        color: var(--fg2);
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        min-height: 15px;
      }
      .row .v {
        font-size: 11.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: right;
      }
      .row .v.sm {
        font-size: 10px;
        font-weight: 500;
        color: var(--fg2);
      }
      .brand {
        width: 12px;
        height: 12px;
        flex: none;
        fill: var(--fg2);
      }
      .brand.deepseek {
        fill: var(--deepseek);
      }
      .brand.opencode {
        fill: var(--fg);
      }
      .rule {
        height: 1px;
        background: var(--line2);
        margin: 5px 0;
        flex: none;
      }
      .banner {
        display: none;
        font-size: 9px;
        color: var(--err);
        padding: 3px 0;
        text-align: center;
      }
      .banner.show {
        display: block;
      }
      .pdot {
        width: 7px;
        height: 7px;
        border-radius: 4px;
        flex: none;
        background: var(--fg2);
      }
      .bar {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 420ms cubic-bezier(0.2, 0.8, 0.2, 1), background 200ms ease;
      }

      /* ---------------- views ---------------- */
      body.mode-detail #rail,
      body.mode-panel #rail,
      body.mode-rail #detail,
      body.mode-panel #detail,
      body.mode-rail #panel,
      body.mode-detail #panel {
        display: none;
      }

      /* ---------------- rail (collapsed edge dock) ---------------- */
      #rail {
        display: flex;
        flex-direction: column;
        padding-top: 7px;
        min-width: 108px;
      }
      .pblock {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 3px 0 4px;
      }
      .pblock + .pblock {
        border-top: 1px solid var(--line2);
      }
      .pname {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 9.5px;
        font-weight: 600;
        letter-spacing: 0.2px;
        color: var(--fg2);
        white-space: nowrap;
      }
      .big {
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      .psub {
        font-size: 9px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mini {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 4px 0 3px;
      }
      .mini .mrow {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .mini .mlabel {
        font-size: 9px;
        color: var(--fg2);
        white-space: nowrap;
      }
      .mini .mpct {
        font-size: 11px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        line-height: 1.1;
      }
      .mini .msub {
        font-size: 8.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .mini .bar {
        height: 3px;
      }
      .sysgrid {
        display: flex;
        gap: 6px;
        padding: 2px 0;
      }
      .syscell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 5px 7px 6px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: var(--card);
      }
      .syscell .sysval {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.3px;
      }
      .syscell .bar {
        height: 3px;
        margin-top: 1px;
      }
      .empty {
        font-size: 9.5px;
        color: var(--fg2);
        padding: 8px 0;
        line-height: 1.5;
      }

      /* ---------------- expanded detail ---------------- */
      #detail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 8px;
        width: 292px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px 10px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      .cardhead {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cardhead .title {
        font-size: 11.5px;
        font-weight: 650;
      }
      .cardhead .headval {
        margin-left: auto;
        font-size: 15px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.2px;
      }
      .cardhead .state {
        margin-left: auto;
        font-size: 9.5px;
        color: var(--fg2);
      }
      .cardsub {
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .qrow {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 3px 0;
      }
      .qtop {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .qtop .qlabel {
        font-size: 9px;
        letter-spacing: 0.7px;
        color: var(--fg2);
        white-space: nowrap;
      }
      .qtop .qv {
        font-size: 11px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .qsub {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .statrow {
        display: flex;
        gap: 8px;
      }
      .stat {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        min-width: 0;
      }
      .stat .sv {
        font-size: 16px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.3px;
      }

      /* ---------------- settings panel ---------------- */
      #panel {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 8px;
        width: 292px;
      }
      .panelhead {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .panelhead .title {
        font-size: 11.5px;
        font-weight: 650;
      }
      .panelhead button {
        margin-left: auto;
        width: auto;
        height: 19px;
        padding: 0 8px;
        font-size: 10px;
        border: 1px solid var(--line);
        color: var(--fg);
      }
      .pitem {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 0;
      }
      .pitem + .pitem {
        border-top: 1px solid var(--line2);
      }
      .pmeta {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .pmeta .pn {
        font-size: 10.5px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pmeta .po {
        font-size: 8.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .pmeta .po.warn {
        color: var(--warn);
      }
      .pctl {
        display: flex;
        align-items: center;
        gap: 1px;
        flex: none;
      }
      .pctl button {
        width: 16px;
        height: 16px;
        font-size: 8px;
        border-radius: 4px;
      }
      .pctl button[disabled] {
        opacity: 0.25;
        cursor: default;
        background: transparent;
      }
      .sw {
        position: relative;
        display: inline-flex;
        flex: none;
        width: 26px;
        height: 15px;
        margin-left: 3px;
        -webkit-app-region: no-drag;
        app-region: no-drag;
      }
      .sw input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .sw i {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        background: var(--track);
        transition: background 150ms ease;
      }
      .sw i::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 11px;
        height: 11px;
        border-radius: 6px;
        background: #fff;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        transition: transform 150ms cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      .sw input:checked + i {
        background: var(--accent);
      }
      .sw input:checked + i::after {
        transform: translateX(11px);
      }
      .hint {
        font-size: 8.5px;
        line-height: 1.55;
        color: var(--fg2);
        word-break: break-all;
      }
    </style>
  </head>
  <body data-snap="free" class="mode-rail">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <symbol id="i-opencode" viewBox="0 0 24 24"><path d="M22 24H2V0h20zM17 4.8H7v14.4h10z" /></symbol>
        <symbol id="i-deepseek" viewBox="0 0 24 24"><path d="M23.748 4.651c-.254-.124-.364.113-.512.233-.051.04-.094.09-.137.137-.372.397-.806.657-1.373.626-.829-.046-1.537.214-2.163.848-.133-.782-.575-1.248-1.247-1.548-.352-.155-.708-.311-.955-.65-.172-.24-.219-.509-.305-.774-.055-.16-.11-.323-.293-.35-.2-.031-.278.136-.356.276-.313.572-.434 1.202-.422 1.84.027 1.436.633 2.58 1.838 3.393.137.094.172.187.129.323-.082.28-.18.553-.266.833-.055.179-.137.218-.328.14a5.5 5.5 0 0 1-1.737-1.179c-.857-.828-1.631-1.743-2.597-2.46a12 12 0 0 1-.689-.47c-.985-.957.13-1.743.387-1.836.27-.098.094-.433-.778-.428-.872.003-1.67.295-2.687.685a3 3 0 0 1-.465.136 9.6 9.6 0 0 0-2.883-.101c-1.885.21-3.39 1.1-4.497 2.622C.082 8.776-.231 10.854.152 13.02c.403 2.284 1.568 4.175 3.36 5.653 1.857 1.533 3.997 2.284 6.438 2.14 1.482-.085 3.132-.284 4.994-1.86.47.234.962.328 1.78.398.629.058 1.235-.031 1.705-.129.735-.155.684-.836.418-.961-2.155-1.004-1.682-.595-2.112-.926 1.095-1.295 2.768-3.598 3.284-6.733.05-.346.115-.834.108-1.114-.004-.171.035-.238.23-.257a4.2 4.2 0 0 0 1.545-.475c1.397-.763 1.96-2.016 2.093-3.517.02-.23-.004-.467-.247-.588" /></symbol>
      </defs>
    </svg>

    <div class="shell">
      <div class="app" id="app">
        <div class="content" id="content">
          <div class="controls">
            <button id="btn-mode" title="展开详情">⤢</button>
            <button id="btn-settings" title="选择显示的额度">⚙</button>
            <button id="btn-flip" title="换到另一侧">⇄</button>
            <button id="btn-close" title="退出 Side Dock">✕</button>
          </div>

          <div class="banner" id="banner">监视器未连接</div>

          <div id="rail"></div>
          <div id="detail"></div>
          <div id="panel"></div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const api = window.sideDock;
        const $ = (id) => document.getElementById(id);
        const MODE_KEY = 'dsh.side-dock.expanded';
        const ITEM_LABELS = { tokens: '本月 tokens', rate: 'tok/s', system: 'CPU / 内存' };

        let expanded = false;
        try {
          expanded = window.localStorage.getItem(MODE_KEY) === '1';
        } catch {
          expanded = false;
        }
        let settingsOpen = false;
        let snapshot = null;
        let settings = { providers: [], items: { tokens: true, rate: true, system: true } };
        let settingsHold = 0; // ignore engine settings while our own save is in flight

        /** Enabled providers in the order the user arranged them. */
        function shownProviders(data) {
          const byId = new Map((data.providers || []).map((provider) => [provider.id, provider]));
          const list = [];
          for (const id of settings.providers) {
            const provider = byId.get(id);
            if (provider) list.push(provider);
          }
          return list;
        }

        // ---------------------------------------------------------- utilities

        function clampPct(value) {
          const n = Number(value);
          if (!Number.isFinite(n)) return 0;
          return Math.max(0, Math.min(100, n));
        }

        function fmtTokens(value) {
          const n = Number(value);
          if (!Number.isFinite(n)) return '—';
          if (n < 1000) return String(Math.round(n));
          if (n < 1e6) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
          if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
          return (n / 1e9).toFixed(2) + 'B';
        }

        function money(balance) {
          if (!balance) return '—';
          const symbol = balance.currency === 'USD' ? '$' : '¥';
          const value = Number(balance.total);
          return symbol + (Number.isFinite(value) ? value.toFixed(2) : '0.00');
        }

        function clock(ms) {
          try {
            return new Date(ms).toLocaleTimeString([], { hour12: false });
          } catch {
            return '—';
          }
        }

        /** "5d 22h" / "11.1 小时" style remaining time. */
        function fmtLeft(iso, compact) {
          const target = Date.parse(iso || '');
          if (!Number.isFinite(target)) return '—';
          const ms = Math.max(0, target - Date.now());
          const hours = ms / 3600000;
          if (compact && hours <= 24) return hours.toFixed(1) + ' 小时';
          const days = Math.floor(hours / 24);
          const restHours = Math.floor(hours % 24);
          if (days >= 1) return days + 'd ' + restHours + 'h';
          return Math.floor(hours) + 'h ' + Math.floor((ms % 3600000) / 60000) + 'm';
        }

        function usageColor(remaining) {
          if (remaining <= 15) return 'var(--err)';
          if (remaining <= 35) return 'var(--warn)';
          return 'var(--accent)';
        }

        function remainingPercent(window) {
          if (!window) return null;
          return clampPct(100 - clampPct(window.percent));
        }

        function el(tag, className, text) {
          const node = document.createElement(tag);
          if (className) node.className = className;
          if (text !== undefined && text !== null) node.textContent = String(text);
          return node;
        }

        function bar(remaining) {
          const track = el('div', 'bar');
          const fill = el('i');
          if (remaining !== null) {
            fill.style.width = remaining + '%';
            fill.style.background = usageColor(remaining);
          }
          track.appendChild(fill);
          return track;
        }

        function brandLogo(provider, size) {
          if (provider.logo) {
            const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svg.setAttribute('class', 'brand ' + provider.logo);
            svg.setAttribute('viewBox', '0 0 24 24');
            svg.setAttribute('aria-hidden', 'true');
            if (size) {
              svg.style.width = size + 'px';
              svg.style.height = size + 'px';
            }
            const use = document.createElementNS('http://www.w3.org/2000/svg', 'use');
            use.setAttribute('href', '#i-' + provider.logo);
            svg.appendChild(use);
            return svg;
          }
          const dot = el('i', 'pdot');
          dot.style.background = provider.accent || 'var(--fg2)';
          return dot;
        }

        function dot(provider) {
          const node = el('i', 'pdot');
          node.style.background = provider.accent || 'var(--fg2)';
          return node;
        }

        function statusText(provider) {
          if (provider.status === 'no-key') return '未配置 Key';
          if (provider.status === 'error') return '查询失败';
          if (provider.status === 'loading') return '读取中…';
          if (provider.status === 'warning') return '余额不足';
          return '实时';
        }

        function keyHint(provider) {
          return provider.envKey ? '未配置 Key · 设 ' + provider.envKey : '未配置 Key';
        }

        function detailSub(provider) {
          if (provider.kind === 'balance') {
            const balance = provider.balance;
            if (!balance) return provider.status === 'no-key' ? keyHint(provider) : statusText(provider);
            const parts = [];
            const spent = Number(balance.spent);
            if (Number(balance.toppedUp) > 0) parts.push('充值 ' + money({ currency: balance.currency, total: balance.toppedUp }));
            if (Number(balance.granted) > 0) parts.push('赠送 ' + money({ currency: balance.currency, total: balance.granted }));
            if (Number.isFinite(spent) && spent > 0) parts.push('已用 ' + money({ currency: balance.currency, total: spent }));
            return parts.join(' · ');
          }
          if (!provider.windows || !provider.windows.length) {
            return provider.status === 'no-key' ? keyHint(provider) : statusText(provider);
          }
          return '';
        }

        function railSub(provider) {
          const sub = detailSub(provider);
          return sub && sub.length > 26 ? sub.slice(0, 25) + '…' : sub;
        }

        // ------------------------------------------------------------- rail

        function railProvider(provider) {
          const block = el('div', 'pblock');
          const name = el('div', 'pname');
          name.appendChild(brandLogo(provider, 10));
          name.appendChild(el('span', null, provider.name));
          block.appendChild(name);

          if (provider.kind === 'balance') {
            block.appendChild(el('div', 'big', money(provider.balance)));
            const sub = railSub(provider);
            if (sub) block.appendChild(el('div', 'psub', sub));
            return block;
          }

          if (!provider.windows || !provider.windows.length) {
            block.appendChild(el('div', 'big', '—'));
            const sub = railSub(provider);
            if (sub) block.appendChild(el('div', 'psub', sub));
            return block;
          }

          for (const window of provider.windows) {
            const remaining = remainingPercent(window);
            const limited = window.status && window.status !== 'ok';
            const mini = el('div', 'mini');
            const top = el('div', 'mrow');
            top.appendChild(el('span', 'mlabel', window.label));
            const pct = el('span', 'mpct', remaining === null ? '—' : Math.round(remaining) + '%');
            if (limited) {
              pct.textContent = '限流';
              pct.style.color = 'var(--err)';
            } else if (remaining !== null && remaining <= 15) {
              pct.style.color = 'var(--err)';
            }
            top.appendChild(pct);
            mini.appendChild(top);
            mini.appendChild(bar(remaining));
            mini.appendChild(el('div', 'msub', remaining === null ? '—' : '剩 ' + fmtLeft(window.resetsAt, true)));
            block.appendChild(mini);
          }
          return block;
        }

        function renderRail(data) {
          const box = $('rail');
          box.textContent = '';
          const enabled = shownProviders(data);
          if (!enabled.length) {
            box.appendChild(el('div', 'empty', '没有选择供应商。点 ⚙ 勾选要显示的额度或余额。'));
          }
          for (const provider of enabled) box.appendChild(railProvider(provider));

          const footer = el('div');
          footer.appendChild(el('div', 'rule'));
          if (settings.items.tokens) {
            const row = el('div', 'row');
            row.appendChild(el('span', 'k', '本月'));
            row.appendChild(el('span', 'v sm', fmtTokens(data.history.month)));
            footer.appendChild(row);
          }
          if (settings.items.rate) {
            const rate = Number(data.history.ratePerSecond) || 0;
            const row = el('div', 'row');
            row.appendChild(el('span', 'k', 'tok/s'));
            row.appendChild(el('span', 'v sm', rate >= 10 ? String(Math.round(rate)) : rate.toFixed(1)));
            footer.appendChild(row);
          }
          if (settings.items.system) {
            const grid = el('div', 'sysgrid');
            grid.appendChild(systemCell('CPU', data.cpu ? clampPct(data.cpu.percent) : 0, 'rail-cpu'));
            grid.appendChild(systemCell('MEM', data.memory ? clampPct(data.memory.percent) : 0, 'rail-mem'));
            footer.appendChild(grid);
          }
          const updated = el('div', 'row');
          updated.appendChild(el('span', 'k', '更新'));
          updated.appendChild(el('span', 'v sm', clock(data.time || Date.now())));
          footer.appendChild(updated);
          box.appendChild(footer);
        }

        function systemCell(label, percent, key) {
          const cell = el('div', 'syscell');
          cell.appendChild(el('span', 'k', label));
          const value = el('span', 'sysval', Math.round(percent) + '%');
          value.style.color = percent >= 85 ? 'var(--err)' : percent >= 65 ? 'var(--warn)' : 'inherit';
          cell.appendChild(value);
          cell.appendChild(bar(percent));
          const fill = cell.querySelector('.bar > i');
          if (fill) fill.style.background = percent >= 85 ? 'var(--err)' : percent >= 65 ? 'var(--warn)' : 'var(--accent)';
          if (key) cell.id = key;
          return cell;
        }

        // ----------------------------------------------------------- detail

        function detailProvider(provider) {
          const card = el('div', 'card');
          const head = el('div', 'cardhead');
          head.appendChild(brandLogo(provider, 12));
          head.appendChild(el('span', 'title', provider.name));

          if (provider.kind === 'balance') {
            head.appendChild(el('span', 'headval', money(provider.balance)));
            card.appendChild(head);
            const sub = detailSub(provider);
            if (sub) card.appendChild(el('div', 'cardsub', sub));
            return card;
          }

          const state = el('span', 'state', statusText(provider));
          if (provider.status === 'no-key' || provider.status === 'error') state.style.color = 'var(--err)';
          if (provider.error) state.title = provider.error;
          head.appendChild(state);
          card.appendChild(head);

          if (!provider.windows || !provider.windows.length) {
            const sub = detailSub(provider);
            if (sub) card.appendChild(el('div', 'cardsub', sub));
            return card;
          }

          for (const window of provider.windows) {
            const remaining = remainingPercent(window);
            const limited = window.status && window.status !== 'ok';
            const row = el('div', 'qrow');
            const top = el('div', 'qtop');
            top.appendChild(el('span', 'qlabel', window.label));
            const value = el(
              'span',
              'qv',
              remaining === null
                ? '—'
                : (limited ? '限流 · ' : '剩 ' + Math.round(remaining) + '% · ') + '已用 ' + Math.round(clampPct(window.percent)) + '%',
            );
            value.style.color = limited || (remaining !== null && remaining <= 15) ? 'var(--err)' : 'var(--fg)';
            top.appendChild(value);
            row.appendChild(top);
            row.appendChild(bar(remaining));
            const sub = el('div', 'qsub');
            sub.appendChild(el('span', null, '重置'));
            sub.appendChild(el('span', null, remaining === null ? '—' : '还有 ' + fmtLeft(window.resetsAt)));
            row.appendChild(sub);
            card.appendChild(row);
          }
          return card;
        }

        function renderDetail(data) {
          const box = $('detail');
          box.textContent = '';
          const enabled = shownProviders(data);
          if (!enabled.length) {
            const card = el('div', 'card');
            card.appendChild(el('div', 'cardsub', '没有选择供应商。点上方 ⚙ 勾选要显示的额度或余额。'));
            box.appendChild(card);
          }
          for (const provider of enabled) box.appendChild(detailProvider(provider));

          const stats = [];
          if (settings.items.tokens) stats.push(['本月 tokens', fmtTokens(data.history.month)]);
          if (settings.items.rate) {
            const rate = Number(data.history.ratePerSecond) || 0;
            stats.push(['tok/s', rate >= 10 ? String(Math.round(rate)) : rate.toFixed(1)]);
          }
          if (stats.length) {
            const row = el('div', 'statrow');
            for (const [label, value] of stats) {
              const stat = el('div', 'stat');
              stat.appendChild(el('span', 'k', label));
              stat.appendChild(el('span', 'sv', value));
              row.appendChild(stat);
            }
            box.appendChild(row);
          }

          if (settings.items.system) {
            const grid = el('div', 'sysgrid');
            grid.appendChild(systemCell('CPU', data.cpu ? clampPct(data.cpu.percent) : 0));
            grid.appendChild(systemCell('MEM', data.memory ? clampPct(data.memory.percent) : 0));
            box.appendChild(grid);
          }

          const updated = el('div', 'row');
          updated.appendChild(el('span', 'k', '更新'));
          updated.appendChild(el('span', 'v sm', clock(data.time || Date.now())));
          box.appendChild(updated);
        }

        // ---------------------------------------------------------- settings

        function switchControl(checked, onChange) {
          const label = el('label', 'sw');
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.checked = checked;
          input.addEventListener('change', () => onChange(input.checked));
          label.appendChild(input);
          label.appendChild(el('i'));
          return label;
        }

        function moveProvider(id, direction) {
          const order = settings.providers.slice();
          const index = order.indexOf(id);
          if (index < 0) return;
          const next = index + direction;
          if (next < 0 || next >= order.length) return;
          order.splice(index, 1);
          order.splice(next, 0, id);
          void saveSettings({ providers: order });
        }

        function toggleProvider(id, enabled) {
          const order = settings.providers.filter((entry) => entry !== id);
          if (enabled) order.push(id);
          void saveSettings({ providers: order });
        }

        function renderPanel() {
          const box = $('panel');
          box.textContent = '';

          const head = el('div', 'panelhead');
          head.appendChild(el('span', 'title', '显示项'));
          const done = el('button', null, '完成');
          done.addEventListener('click', () => {
            settingsOpen = false;
            applyMode();
          });
          head.appendChild(done);
          box.appendChild(head);

          const list = el('div', 'card');
          list.appendChild(el('div', 'cardsub', '供应商 — 勾选要显示的余额或额度'));
          const providers = (snapshot && snapshot.providers) || [];
          for (const provider of providers) {
            const enabled = settings.providers.includes(provider.id);
            const item = el('div', 'pitem');
            item.appendChild(dot(provider));
            const meta = el('div', 'pmeta');
            meta.appendChild(el('span', 'pn', provider.name));
            const note = el('span', 'po', provider.configured ? provider.note : provider.note + ' · 未配置 Key');
            if (!provider.configured) note.className = 'po warn';
            meta.appendChild(note);
            item.appendChild(meta);

            const ctl = el('div', 'pctl');
            const position = settings.providers.indexOf(provider.id);
            const up = el('button', null, '▲');
            up.title = '上移';
            up.disabled = !enabled || position <= 0;
            up.addEventListener('click', () => moveProvider(provider.id, -1));
            const down = el('button', null, '▼');
            down.title = '下移';
            down.disabled = !enabled || position < 0 || position >= settings.providers.length - 1;
            down.addEventListener('click', () => moveProvider(provider.id, 1));
            ctl.appendChild(up);
            ctl.appendChild(down);
            ctl.appendChild(switchControl(enabled, (checked) => toggleProvider(provider.id, checked)));
            item.appendChild(ctl);
            list.appendChild(item);
          }
          box.appendChild(list);

          const extras = el('div', 'card');
          extras.appendChild(el('div', 'cardsub', '其他显示项'));
          for (const key of Object.keys(ITEM_LABELS)) {
            const row = el('div', 'pitem');
            const meta = el('div', 'pmeta');
            meta.appendChild(el('span', 'pn', ITEM_LABELS[key]));
            row.appendChild(meta);
            const ctl = el('div', 'pctl');
            ctl.appendChild(
              switchControl(Boolean(settings.items[key]), (checked) => {
                const items = { ...settings.items, [key]: checked };
                void saveSettings({ items });
              }),
            );
            row.appendChild(ctl);
            extras.appendChild(row);
          }
          box.appendChild(extras);

          box.appendChild(el('div', 'hint', '选择会保存在 ~/.side-dock/config.json。Key 依次从环境变量、DSH 凭据库、该文件的 *ApiKey 字段读取。'));
        }

        // ------------------------------------------------------------- state

        async function saveSettings(patch) {
          settingsHold = Date.now() + 2000;
          try {
            const saved = await api.saveSettings(patch);
            if (saved) settings = saved;
          } catch (error) {
            if (api.report) api.report('save settings failed: ' + String(error));
          }
          paint();
        }

        function paint() {
          if (!snapshot) return;
          const data = snapshot;
          if (document.body.classList.contains('mode-rail')) renderRail(data);
          else if (document.body.classList.contains('mode-detail')) renderDetail(data);
          else renderPanel();
        }

        function applyMode() {
          const mode = settingsOpen ? 'panel' : expanded ? 'detail' : 'rail';
          document.body.classList.remove('mode-rail', 'mode-detail', 'mode-panel');
          document.body.classList.add('mode-' + mode);
          const modeButton = $('btn-mode');
          if (modeButton) {
            modeButton.textContent = expanded ? '⤡' : '⤢';
            modeButton.title = expanded ? '收起为侧边条' : '展开详情';
          }
          const settingsButton = $('btn-settings');
          if (settingsButton) settingsButton.classList.toggle('on', settingsOpen);
          paint();
        }

        function applyState(next) {
          const snap = next && next.snap ? next.snap : 'free';
          document.body.dataset.snap = snap;
        }

        function setSnapshot(payload) {
          const offline = Boolean(payload && payload.offline);
          $('banner').classList.toggle('show', offline);
          if (offline) $('banner').title = payload && payload.error ? payload.error : '';
          const data = payload && payload.data ? payload.data : null;
          if (data) {
            snapshot = data;
            // The engine is the source of truth, except right after a save:
            // an in-flight poll can still carry the pre-save settings.
            if (data.settings && Date.now() > settingsHold) settings = data.settings;
          }
          paint();
        }

        // ------------------------------------------------------------- wiring

        window.addEventListener('error', (event) => {
          if (api && api.report) api.report('error: ' + (event && event.message ? event.message : 'unknown'));
        });
        window.addEventListener('unhandledrejection', (event) => {
          if (api && api.report) api.report('rejection: ' + String(event && event.reason));
        });

        api.onStats(setSnapshot);
        api.onState(applyState);

        $('btn-mode').onclick = () => {
          expanded = !expanded;
          settingsOpen = false;
          try {
            window.localStorage.setItem(MODE_KEY, expanded ? '1' : '0');
          } catch {
            /* ignore */
          }
          applyMode();
        };
        $('btn-settings').onclick = () => {
          if (!expanded) {
            expanded = true;
            try {
              window.localStorage.setItem(MODE_KEY, '1');
            } catch {
              /* ignore */
            }
          }
          settingsOpen = !settingsOpen;
          applyMode();
        };
        $('btn-flip').onclick = () => api.flip().then(applyState);
        $('btn-close').onclick = () => {
          if (api.closeDesktop) api.closeDesktop();
        };

        // The window is exactly as large as the card: the card is laid out at its
        // natural (max-content) size, so its rect is the size the window must take.
        const contentElement = $('content');
        let lastWidth = 0;
        let lastHeight = 0;
        function reportFit() {
          if (!contentElement) return;
          const rect = contentElement.getBoundingClientRect();
          // Quantize so a one-pixel text change never makes the strip jitter.
          const width = Math.ceil(rect.width / 4) * 4;
          const height = Math.ceil(rect.height / 2) * 2;
          if (!width || !height) return;
          if (width === lastWidth && height === lastHeight) return;
          lastWidth = width;
          lastHeight = height;
          if (api.fit) api.fit({ width, height });
          else if (api.setHeight) api.setHeight(height);
        }
        if (typeof ResizeObserver === 'function' && contentElement) {
          new ResizeObserver(() => reportFit()).observe(contentElement);
        }
        window.addEventListener('load', reportFit);
        setTimeout(reportFit, 60);
        setTimeout(reportFit, 400);
        setTimeout(reportFit, 1200);

        applyMode();
        Promise.all([api.init(), api.latest()])
          .then(([init, latest]) => {
            applyState(init || {});
            if (latest) setSnapshot(latest);
            else paint();
            if (api.report) {
              const text = (document.body.innerText || '').replace(/\s+/g, ' ').slice(0, 180);
              api.report(
                'renderer ready snap=' +
                  document.body.dataset.snap +
                  ' mode=' +
                  document.body.className +
                  ' providers=' +
                  settings.providers.join(',') +
                  ' [' +
                  text +
                  ']',
              );
            }
          })
          .catch((error) => {
            if (api.report) api.report('init failed: ' + String(error));
          });
      })();
    </script>
  </body>
</html>
