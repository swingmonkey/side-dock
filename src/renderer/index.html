<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
    <title>Side Dock</title>
    <!--
      Design language adapted from Javis603/token-monitor (MIT): an edge dock
      that keeps provider quota rings visible and expands into a detail card
      (per-provider windows, reset countdowns, day/month totals, sessions).
      Provider marks are Simple Icons SVG paths (CC0 1.0); the OpenCode and
      DeepSeek names/logos remain trademarks of their owners.
    -->
    <style>
      :root {
        --fg: #edf0f4;
        --fg2: #9aa3ad;
        --line: rgba(255, 255, 255, 0.1);
        --line2: rgba(255, 255, 255, 0.06);
        --app: rgba(28, 30, 34, 0.62);
        --card: rgba(255, 255, 255, 0.055);
        --card2: rgba(255, 255, 255, 0.085);
        --accent: #4fb4a8;
        --ok: #32d583;
        --warn: #f5a524;
        --err: #ff6166;
        --track: rgba(255, 255, 255, 0.1);
        --deepseek: #4d6bfe;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --fg: #1b1f24;
          --fg2: #667085;
          --line: rgba(0, 0, 0, 0.1);
          --line2: rgba(0, 0, 0, 0.06);
          --app: rgba(249, 250, 252, 0.7);
          --card: rgba(0, 0, 0, 0.04);
          --card2: rgba(0, 0, 0, 0.065);
          --accent: #0f8a80;
          --ok: #0f9d58;
          --warn: #a15c00;
          --err: #c62828;
          --track: rgba(0, 0, 0, 0.08);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        background: transparent;
        overflow: hidden;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', system-ui, sans-serif;
        font-size: 12px;
        color: var(--fg);
        -webkit-font-smoothing: antialiased;
        user-select: none;
        cursor: default;
      }
      .shell {
        padding: 0;
        height: 100%;
        width: 100%;
      }
      .app {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--app);
        border: none;
        border-radius: 0;
        overflow: hidden;
        backdrop-filter: blur(30px) saturate(1.6);
        cursor: grab;
        -webkit-app-region: drag;
        app-region: drag;
      }
      /* Outer (non-docked) edge stays rounded; the docked edge is flush. */
      body[data-snap='left'] .app {
        border-radius: 0 16px 16px 0;
      }
      body[data-snap='right'] .app {
        border-radius: 16px 0 0 16px;
      }
      body[data-snap='top'] .app {
        border-radius: 0 0 16px 16px;
      }
      body[data-snap='bottom'] .app {
        border-radius: 16px 16px 0 0;
      }
      body[data-snap='free'] .app {
        border-radius: 16px;
      }
      .content {
        flex: 0 0 auto;
        width: max-content;
        display: flex;
        flex-direction: column;
        padding: 7px 10px 9px;
      }
      .controls {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 2px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--line);
      }
      button {
        font: inherit;
        color: var(--fg2);
        background: transparent;
        border: 1px solid transparent;
        border-radius: 6px;
        width: 20px;
        height: 20px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
        font-size: 11px;
        line-height: 1;
        -webkit-app-region: no-drag;
        app-region: no-drag;
        transition: background 120ms ease, color 120ms ease, border-color 120ms ease;
      }
      button:hover {
        background: var(--card2);
        color: var(--fg);
        border-color: var(--line);
      }
      .k {
        font-size: 9px;
        letter-spacing: 0.7px;
        color: var(--fg2);
        text-transform: uppercase;
        white-space: nowrap;
      }
      .row {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        padding: 2px 0;
        min-height: 15px;
      }
      .row .v {
        font-size: 11.5px;
        font-weight: 600;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
        text-align: right;
      }
      .row .v.sm {
        font-size: 10px;
        font-weight: 500;
        color: var(--fg2);
      }
      .brand {
        width: 12px;
        height: 12px;
        flex: none;
        fill: var(--fg2);
      }
      .brand.deepseek {
        fill: var(--deepseek);
      }
      .brand.opencode {
        fill: var(--fg);
      }
      .rule {
        height: 1px;
        background: var(--line2);
        margin: 5px 0;
        flex: none;
      }
      .banner {
        display: none;
        font-size: 9px;
        color: var(--err);
        padding: 3px 0;
        text-align: center;
      }
      .banner.show {
        display: block;
      }
      .dot {
        display: inline-block;
        width: 5px;
        height: 5px;
        border-radius: 3px;
        margin-right: 4px;
        vertical-align: 1px;
        background: var(--fg2);
        opacity: 0.55;
      }
      .dot.running {
        background: var(--ok);
        opacity: 1;
      }

      /* ---------------- rail (collapsed edge dock) ---------------- */
      body.expanded #rail {
        display: none;
      }
      #rail {
        display: flex;
        flex-direction: column;
        padding-top: 7px;
        min-width: 104px;
      }
      .todaybox {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 0;
        padding-bottom: 6px;
      }
      .todaybox .today {
        font-size: 21px;
        font-weight: 680;
        letter-spacing: -0.6px;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
      }
      .todaybox .rate {
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .ringrow {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 5px 0;
      }
      .ringrow + .ringrow {
        border-top: 1px solid var(--line2);
      }
      .ringwrap {
        position: relative;
        width: 36px;
        height: 36px;
        flex: none;
      }
      .ringwrap svg.ring {
        display: block;
        width: 36px;
        height: 36px;
        transform: rotate(-90deg);
      }
      .ring-track {
        fill: none;
        stroke: var(--track);
        stroke-width: 3.5;
      }
      .ring-fill {
        fill: none;
        stroke: var(--accent);
        stroke-width: 3.5;
        stroke-linecap: round;
        transition: stroke-dashoffset 420ms cubic-bezier(0.2, 0.8, 0.2, 1), stroke 200ms ease;
      }
      .ring-icon {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 13px;
        height: 13px;
        transform: translate(-50%, -50%);
        fill: var(--fg);
      }
      .ringmeta {
        display: flex;
        flex-direction: column;
        gap: 0;
        min-width: 0;
      }
      .ringmeta .rv {
        font-size: 12.5px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        line-height: 1.15;
      }
      .ringmeta .rs {
        font-size: 9px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      /* DeepSeek balance: the number people actually squint at — keep it large */
      .balancebox {
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 2px 0 1px;
      }
      .balancebox .k {
        display: inline-flex;
        align-items: center;
        gap: 4px;
        text-transform: none;
        letter-spacing: 0.2px;
        font-size: 9.5px;
      }
      .balancebox .amount {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1.15;
        font-variant-numeric: tabular-nums;
      }
      /* CPU / MEM: label + large value + thin bar, one cell each */
      .sysgrid {
        display: flex;
        gap: 6px;
        padding: 2px 0;
      }
      .syscell {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 5px 7px 6px;
        border: 1px solid var(--line2);
        border-radius: 8px;
        background: var(--card);
      }
      .syscell .sysval {
        font-size: 17px;
        font-weight: 700;
        line-height: 1.1;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.3px;
      }
      .syscell .bar {
        height: 3px;
        margin-top: 1px;
      }

      /* ---------------- expanded detail ---------------- */
      body:not(.expanded) #detail {
        display: none;
      }
      #detail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding-top: 8px;
        width: 292px;
      }
      .card {
        display: flex;
        flex-direction: column;
        gap: 5px;
        padding: 8px 10px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
      }
      .cardhead {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .cardhead .title {
        font-size: 11.5px;
        font-weight: 650;
      }
      .cardhead .headval {
        margin-left: auto;
        font-size: 15px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.2px;
      }
      .cardhead .state {
        margin-left: auto;
        font-size: 9.5px;
        color: var(--fg2);
      }
      .cardsub {
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .qrow {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 3px 0;
      }
      .qtop {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .qtop .qv {
        font-size: 11px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .qsub {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .bar {
        position: relative;
        height: 4px;
        border-radius: 2px;
        background: var(--track);
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: var(--accent);
        transition: width 420ms cubic-bezier(0.2, 0.8, 0.2, 1), background 200ms ease;
      }
      .statrow {
        display: flex;
        gap: 8px;
      }
      .stat {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 1px;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        min-width: 0;
      }
      .stat .sv {
        font-size: 16px;
        font-weight: 680;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.3px;
      }
      .session {
        display: flex;
        flex-direction: column;
        gap: 3px;
        padding: 5px 0;
      }
      .session + .session {
        border-top: 1px solid var(--line2);
      }
      .session .s1 {
        display: flex;
        align-items: baseline;
        gap: 5px;
      }
      .session .sname {
        flex: 1;
        min-width: 0;
        font-size: 11px;
        font-weight: 600;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session .stok {
        font-size: 10.5px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .session .s2 {
        display: flex;
        align-items: baseline;
        gap: 6px;
        font-size: 9px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
      .session .smeta {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .session .bar {
        height: 3px;
        margin-top: 1px;
      }
      .sysrow {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
        font-size: 9.5px;
        color: var(--fg2);
        font-variant-numeric: tabular-nums;
      }
    </style>
  </head>
  <body data-snap="free" class="rail">
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">

        <symbol id="i-opencode" viewBox="0 0 24 24"><path d="M22 24H2V0h20zM17 4.8H7v14.4h10z" /></symbol>

    </svg>

    <div class="shell">
      <div class="app" id="app">
        <div class="content" id="content">
          <div class="controls">
            <button id="btn-mode" title="展开详情">⤢</button>
            <button id="btn-flip" title="换到另一侧">⇄</button>
            <button id="btn-close" title="退出 Side Dock">✕</button>
          </div>

          <div class="banner" id="banner">监视器未连接</div>

          <!-- ---------------- rail ---------------- -->
          <div id="rail">
            <div class="todaybox">
              <span class="k">今日 tokens</span>
              <span class="today" id="rail-today">—</span>
              <span class="rate"><span id="rail-rate">0</span> tok/s</span>
            </div>

            <div class="ringrow">
              <div class="ringwrap">
                <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                  <circle class="ring-track" cx="18" cy="18" r="15"></circle>
                  <circle class="ring-fill" id="ring-rolling" cx="18" cy="18" r="15"></circle>
                </svg>
                <svg class="ring-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-opencode" /></svg>
              </div>
              <div class="ringmeta">
                <span class="k">5 小时</span>
                <span class="rv" id="ring-rolling-pct">—</span>
                <span class="rs" id="ring-rolling-reset">—</span>
              </div>
            </div>

            <div class="ringrow">
              <div class="ringwrap">
                <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                  <circle class="ring-track" cx="18" cy="18" r="15"></circle>
                  <circle class="ring-fill" id="ring-weekly" cx="18" cy="18" r="15"></circle>
                </svg>
                <svg class="ring-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-opencode" /></svg>
              </div>
              <div class="ringmeta">
                <span class="k">周额度</span>
                <span class="rv" id="ring-weekly-pct">—</span>
                <span class="rs" id="ring-weekly-reset">—</span>
              </div>
            </div>

            <div class="ringrow">
              <div class="ringwrap">
                <svg class="ring" viewBox="0 0 36 36" aria-hidden="true">
                  <circle class="ring-track" cx="18" cy="18" r="15"></circle>
                  <circle class="ring-fill" id="ring-monthly" cx="18" cy="18" r="15"></circle>
                </svg>
                <svg class="ring-icon" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-opencode" /></svg>
              </div>
              <div class="ringmeta">
                <span class="k">月额度</span>
                <span class="rv" id="ring-monthly-pct">—</span>
                <span class="rs" id="ring-monthly-reset">—</span>
              </div>
            </div>

            <div class="rule"></div>

            <div class="balancebox">
              <span class="k">
                <svg class="brand deepseek" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-deepseek" /></svg>
                DeepSeek 余额
              </span>
              <span class="amount" id="rail-credit">—</span>
            </div>

            <div class="rule"></div>

            <div class="sysgrid">
              <div class="syscell">
                <span class="k">CPU</span>
                <span class="sysval" id="rail-cpu">—</span>
                <div class="bar"><i id="rail-cpu-bar"></i></div>
              </div>
              <div class="syscell">
                <span class="k">MEM</span>
                <span class="sysval" id="rail-mem">—</span>
                <div class="bar"><i id="rail-mem-bar"></i></div>
              </div>
            </div>

            <div class="row">
              <span class="k">会话</span>
              <span class="v sm" id="rail-sessions">—</span>
            </div>
            <div class="row">
              <span class="k">更新</span>
              <span class="v sm" id="rail-updated">—</span>
            </div>
          </div>

          <!-- ---------------- expanded detail ---------------- -->
          <div id="detail">
            <div class="card">
              <div class="cardhead">
                <svg class="brand deepseek" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-deepseek" /></svg>
                <span class="title">DeepSeek 额度</span>
                <span class="headval" id="det-credit">…</span>
              </div>
              <div class="cardsub" id="det-credit-sub">—</div>
            </div>

            <div class="card">
              <div class="cardhead">
                <svg class="brand opencode" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-opencode" /></svg>
                <span class="title">OpenCode Go 额度</span>
                <span class="state" id="det-zen-state">—</span>
              </div>

              <div class="qrow">
                <div class="qtop"><span class="k">5 小时</span><span class="qv" id="det-rolling-left">—</span></div>
                <div class="bar"><i id="bar-rolling"></i></div>
                <div class="qsub"><span>重置</span><span id="det-rolling-reset">—</span></div>
              </div>

              <div class="qrow">
                <div class="qtop"><span class="k">周额度</span><span class="qv" id="det-weekly-left">—</span></div>
                <div class="bar"><i id="bar-weekly"></i></div>
                <div class="qsub"><span>重置</span><span id="det-weekly-reset">—</span></div>
              </div>

              <div class="qrow">
                <div class="qtop"><span class="k">月额度</span><span class="qv" id="det-monthly-left">—</span></div>
                <div class="bar"><i id="bar-monthly"></i></div>
                <div class="qsub"><span>重置</span><span id="det-monthly-reset">—</span></div>
              </div>
            </div>

            <div class="statrow">
              <div class="stat">
                <span class="k">今日 tokens</span>
                <span class="sv" id="det-today">—</span>
              </div>
              <div class="stat">
                <span class="k">本月 tokens</span>
                <span class="sv" id="det-month">—</span>
              </div>
            </div>

            <div class="card">
              <div class="cardhead">
                <span class="title">会话</span>
                <span class="state" id="det-sessions-state">—</span>
              </div>
              <div id="det-sessions"></div>
            </div>

            <div class="sysgrid">
              <div class="syscell">
                <span class="k">CPU</span>
                <span class="sysval" id="det-cpu">—</span>
                <div class="bar"><i id="det-cpu-bar"></i></div>
              </div>
              <div class="syscell">
                <span class="k">MEM</span>
                <span class="sysval" id="det-mem">—</span>
                <div class="bar"><i id="det-mem-bar"></i></div>
              </div>
              <div class="syscell">
                <span class="k">tok/s</span>
                <span class="sysval" id="det-rate">0</span>
              </div>
            </div>
            <div class="row">
              <span class="k">更新</span>
              <span class="v sm" id="det-updated">—</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      (function () {
        const api = window.sideDock;
        const $ = (id) => document.getElementById(id);
        const RING_RADIUS = 15;
        const RING_LENGTH = 2 * Math.PI * RING_RADIUS;
        const MODE_KEY = 'dsh.side-dock.expanded';

        let expanded = false;
        try {
          expanded = window.localStorage.getItem(MODE_KEY) === '1';
        } catch {
          expanded = false;
        }

        function clampPct(value) {
          const n = Number(value);
          if (!Number.isFinite(n)) return 0;
          return Math.max(0, Math.min(100, n));
        }

        function fmtTokens(value) {
          const n = Number(value);
          if (!Number.isFinite(n)) return '—';
          if (n < 1000) return String(Math.round(n));
          if (n < 1e6) return (n / 1000).toFixed(1).replace(/\.0$/, '') + 'k';
          if (n < 1e9) return (n / 1e6).toFixed(2) + 'M';
          return (n / 1e9).toFixed(2) + 'B';
        }

        function money(wallet) {
          const symbol = wallet && wallet.currency === 'USD' ? '$' : '¥';
          const value = Number(wallet && wallet.total);
          return symbol + (Number.isFinite(value) ? value.toFixed(2) : '0.00');
        }

        function clock(ms) {
          try {
            return new Date(ms).toLocaleTimeString([], { hour12: false });
          } catch {
            return '—';
          }
        }

        /** "5d 22h" / "5.0 小时" style remaining time, like Token Monitor's reset rows. */
        function fmtLeft(iso, compact) {
          const target = Date.parse(iso || '');
          if (!Number.isFinite(target)) return '—';
          const ms = Math.max(0, target - Date.now());
          const hours = ms / 3600000;
          if (compact && hours <= 24) return hours.toFixed(1) + ' 小时';
          const days = Math.floor(hours / 24);
          const restHours = Math.floor(hours % 24);
          if (days >= 1) return days + 'd ' + restHours + 'h';
          return Math.floor(hours) + 'h ' + Math.floor((ms % 3600000) / 60000) + 'm';
        }

        function usageColor(remaining) {
          if (remaining <= 15) return 'var(--err)';
          if (remaining <= 35) return 'var(--warn)';
          return 'var(--accent)';
        }

        function remainingPercent(entry) {
          if (!entry) return null;
          return clampPct(100 - clampPct(entry.percent));
        }

        function setRing(circle, remaining) {
          if (!circle || remaining === null) return;
          circle.style.strokeDasharray = String(RING_LENGTH);
          circle.style.strokeDashoffset = String(RING_LENGTH * (1 - remaining / 100));
          circle.style.stroke = usageColor(remaining);
        }

        function setBar(bar, remaining) {
          if (!bar || remaining === null) return;
          bar.style.width = remaining + '%';
          bar.style.background = usageColor(remaining);
        }

        function setText(id, text) {
          const element = $(id);
          if (element) element.textContent = text;
        }

        function renderCredit(account) {
          let amount = '—';
          let sub = '';
          let title = '';
          if (!account) {
            amount = '读取中';
          } else if (account.status === 'signed-in') {
            const wallets = Array.isArray(account.wallets) ? account.wallets : [];
            const primary = wallets.find((w) => w.currency === 'CNY') || wallets[0];
            amount = money(primary);
            sub =
              '充值 ¥' +
              Number(primary ? primary.toppedUp : 0).toFixed(2) +
              ' · 赠送 ¥' +
              Number(primary ? primary.granted : 0).toFixed(2);
            title = 'DeepSeek API 余额' + (account.available === false ? ' · 余额不足' : '');
          } else if (account.status === 'signed-out') {
            amount = '未登录';
            sub = '未配置 DEEPSEEK_API_KEY';
          } else if (account.status === 'loading') {
            amount = '读取中';
          } else {
            amount = '—';
            sub = account.error || '额度不可用';
          }
          setText('rail-credit', amount);
          setText('det-credit', amount);
          setText('det-credit-sub', sub || '—');
          const rail = $('rail-credit');
          if (rail) rail.title = title || sub;
        }

        function renderZen(zen) {
          const status = zen && zen.status;
          let stateText = '—';
          if (!zen || status === 'no-key') stateText = '未配置 Key';
          else if (status === 'loading') stateText = '读取中…';
          else if (status === 'error') stateText = '查询失败';
          else if (status === 'ok') stateText = '实时';
          setText('det-zen-state', stateText);
          const stateEl = $('det-zen-state');
          if (stateEl) {
            stateEl.style.color = status === 'ok' || status === 'loading' ? 'var(--fg2)' : 'var(--err)';
            stateEl.title = zen && zen.error ? zen.error : '';
          }

          const rows = [
            ['rolling', 'ring-rolling', 'ring-rolling-pct', 'ring-rolling-reset', 'det-rolling-left', 'bar-rolling', 'det-rolling-reset', true],
            ['weekly', 'ring-weekly', 'ring-weekly-pct', 'ring-weekly-reset', 'det-weekly-left', 'bar-weekly', 'det-weekly-reset', false],
            ['monthly', 'ring-monthly', 'ring-monthly-pct', 'ring-monthly-reset', 'det-monthly-left', 'bar-monthly', 'det-monthly-reset', false],
          ];
          for (const row of rows) {
            const entry = zen && zen[row[0]];
            const remaining = remainingPercent(entry);
            if (row[1]) {
              setRing($(row[1]), remaining);
              setText(row[2], remaining === null ? '—' : Math.round(remaining) + '%');
              const pctElement = $(row[2]);
              if (pctElement) {
                const limitedWindow = entry && entry.status && entry.status !== 'ok';
                pctElement.style.color =
                  limitedWindow || (remaining !== null && remaining <= 15) ? 'var(--err)' : 'inherit';
              }
              const limitedWindow = entry && entry.status && entry.status !== 'ok';
              setText(
                row[3],
                remaining === null ? '—' : (limitedWindow ? '限流 · 剩 ' : '剩 ') + fmtLeft(entry && entry.resetsAt, row[7]),
              );
            }
            if (row[4]) {
              const limited = entry && entry.status && entry.status !== 'ok';
              const label =
                remaining === null
                  ? '—'
                  : (limited ? '限流 · ' : '剩 ' + Math.round(remaining) + '% · ') +
                    '已用 ' +
                    Math.round(clampPct(entry.percent)) +
                    '%';
              setText(row[4], label);
              const element = $(row[4]);
              if (element) {
                element.style.color = limited || remaining <= 15 ? 'var(--err)' : 'var(--fg)';
              }
            }
            setBar($(row[5]), remaining);
            setText(row[6], remaining === null ? '—' : '还有 ' + fmtLeft(entry && entry.resetsAt));
          }
        }

        function renderSessions(sessions, totals) {
          setText('rail-sessions', (totals.running || 0) + ' / ' + sessions.length);
          setText('det-sessions-state', (totals.running || 0) + ' 运行 · 共 ' + sessions.length);

          const container = $('det-sessions');
          if (!container) return;
          container.textContent = '';
          if (!sessions.length) {
            const empty = document.createElement('div');
            empty.className = 'cardsub';
            empty.textContent = '暂无活跃会话';
            container.appendChild(empty);
            return;
          }
          for (const session of sessions.slice(0, 4)) {
            const box = document.createElement('div');
            box.className = 'session';
            box.title = [
              session.title || session.id,
              session.model || '',
              '累计 ' + fmtTokens(session.totalTokens),
              '入 ' + fmtTokens(session.usage.input) + ' / 出 ' + fmtTokens(session.usage.output),
            ]
              .filter(Boolean)
              .join('\n');

            const line1 = document.createElement('div');
            line1.className = 's1';
            const dot = document.createElement('span');
            dot.className = 'dot' + (session.running ? ' running' : '');
            const name = document.createElement('span');
            name.className = 'sname';
            name.textContent = session.title || session.id.slice(0, 16);
            const tokens = document.createElement('span');
            tokens.className = 'stok';
            tokens.textContent = fmtTokens(session.totalTokens);
            line1.appendChild(dot);
            line1.appendChild(name);
            line1.appendChild(tokens);

            const line2 = document.createElement('div');
            line2.className = 's2';
            const meta = document.createElement('span');
            meta.className = 'smeta';
            meta.textContent = session.model || (session.running ? '运行中' : '空闲');
            const ratio =
              session.contextWindow && session.contextTokens !== null
                ? clampPct((session.contextTokens / session.contextWindow) * 100)
                : null;
            const ctx = document.createElement('span');
            ctx.textContent = ratio === null ? '' : '上下文 ' + Math.round(ratio) + '%';
            line2.appendChild(meta);
            line2.appendChild(ctx);

            const bar = document.createElement('div');
            bar.className = 'bar';
            const fill = document.createElement('i');
            if (ratio !== null) {
              fill.style.width = ratio + '%';
              fill.style.background = ratio >= 85 ? 'var(--err)' : ratio >= 65 ? 'var(--warn)' : 'var(--accent)';
            }
            bar.appendChild(fill);

            box.appendChild(line1);
            box.appendChild(line2);
            box.appendChild(bar);
            container.appendChild(box);
          }
        }

        function renderSystem(data) {
          const cpu = clampPct(data.cpu ? data.cpu.percent : 0);
          const mem = clampPct(data.memory ? data.memory.percent : 0);
          setText('rail-cpu', Math.round(cpu) + '%');
          setText('rail-mem', Math.round(mem) + '%');
          setText('det-cpu', Math.round(cpu) + '%');
          setText('det-mem', Math.round(mem) + '%');
          const color = (value) => (value >= 85 ? 'var(--err)' : value >= 65 ? 'var(--warn)' : 'inherit');
          const fill = (bar, value) => {
            const el = $(bar);
            if (!el) return;
            el.style.width = value + '%';
            el.style.background =
              value >= 85 ? 'var(--err)' : value >= 65 ? 'var(--warn)' : 'var(--accent)';
          };
          for (const id of ['rail-cpu', 'det-cpu']) {
            const el = $(id);
            if (el) el.style.color = color(cpu);
          }
          for (const id of ['rail-mem', 'det-mem']) {
            const el = $(id);
            if (el) el.style.color = color(mem);
          }
          fill('rail-cpu-bar', cpu);
          fill('rail-mem-bar', mem);
          fill('det-cpu-bar', cpu);
          fill('det-mem-bar', mem);
        }

        let reportedStats = false;
        function render(payload) {
          const offline = Boolean(payload && payload.offline);
          if (!reportedStats && payload && payload.data) {
            reportedStats = true;
            if (api.report) {
              api.report(
                'stats received today=' +
                  payload.data.history.today +
                  ' tokens=' +
                  payload.data.totals.total +
                  ' account=' +
                  payload.data.account.status +
                  ' zen=' +
                  payload.data.zen.status,
              );
            }
          }
          $('banner').classList.toggle('show', offline);
          if (offline) $('banner').title = payload && payload.error ? payload.error : '';

          const data = payload && payload.data ? payload.data : null;
          if (!data) {
            renderCredit(null);
            renderZen(null);
            return;
          }

          renderCredit(data.account);
          renderZen(data.zen);

          const totals = data.totals || {};
          const sessions = Array.isArray(data.sessions) ? data.sessions : [];
          const history = data.history || { today: 0, month: 0, ratePerSecond: 0 };
          const rate = Number(history.ratePerSecond) || 0;
          const rateText = rate >= 10 ? String(Math.round(rate)) : rate.toFixed(1);

          setText('rail-today', fmtTokens(history.today));
          setText('rail-rate', rateText);
          setText('det-today', fmtTokens(history.today));
          setText('det-month', fmtTokens(history.month));
          setText('det-rate', rateText);

          renderSessions(sessions, totals);
          renderSystem(data);

          const time = clock(data.time || Date.now());
          setText('rail-updated', time);
          setText('det-updated', time);
        }

        function applyState(next) {
          const snap = next && next.snap ? next.snap : 'free';
          document.body.dataset.snap = snap;
        }

        function applyMode() {
          document.body.classList.toggle('expanded', expanded);
          document.body.classList.toggle('rail', !expanded);
          const button = $('btn-mode');
          if (button) {
            button.textContent = expanded ? '⤡' : '⤢';
            button.title = expanded ? '收起为侧边条' : '展开详情';
          }
        }

        window.addEventListener('error', (event) => {
          if (api && api.report) api.report('error: ' + (event && event.message ? event.message : 'unknown'));
        });
        window.addEventListener('unhandledrejection', (event) => {
          if (api && api.report) api.report('rejection: ' + String(event && event.reason));
        });

        api.onStats(render);
        api.onState(applyState);

        $('btn-mode').onclick = () => {
          expanded = !expanded;
          try {
            window.localStorage.setItem(MODE_KEY, expanded ? '1' : '0');
          } catch {
            /* ignore */
          }
          applyMode();
        };
        $('btn-flip').onclick = () => api.flip().then(applyState);
        $('btn-close').onclick = () => {
          if (api.closeDesktop) api.closeDesktop();
        };

        // The window is exactly as large as the card: the card is laid out at its
        // natural (max-content) size, so its rect is the size the window must take.
        const contentElement = $('content');
        let lastWidth = 0;
        let lastHeight = 0;
        function reportFit() {
          if (!contentElement) return;
          const rect = contentElement.getBoundingClientRect();
          // Quantize so a one-pixel text change never makes the strip jitter.
          const width = Math.ceil(rect.width / 4) * 4;
          const height = Math.ceil(rect.height / 2) * 2;
          if (!width || !height) return;
          if (width === lastWidth && height === lastHeight) return;
          lastWidth = width;
          lastHeight = height;
          if (api.fit) api.fit({ width, height });
          else if (api.setHeight) api.setHeight(height);
        }
        if (typeof ResizeObserver === 'function' && contentElement) {
          new ResizeObserver(() => reportFit()).observe(contentElement);
        }
        window.addEventListener('load', reportFit);
        setTimeout(reportFit, 60);
        setTimeout(reportFit, 400);
        setTimeout(reportFit, 1200);

        applyMode();
        Promise.all([api.init(), api.latest()])
          .then(([init, snapshot]) => {
            applyState(init || {});
            if (snapshot) render(snapshot);
            else render(null);
            if (api.report) {
              const text = (document.body.innerText || '').replace(/\s+/g, ' ').slice(0, 160);
              api.report(
                'renderer ready snap=' +
                  document.body.dataset.snap +
                  ' mode=' +
                  (expanded ? 'expanded' : 'rail') +
                  ' [' +
                  text +
                  ']',
              );
            }
          })
          .catch((error) => {
            render(null);
            if (api.report) api.report('init failed: ' + String(error));
          });
      })();
    </script>
  </body>
</html>
